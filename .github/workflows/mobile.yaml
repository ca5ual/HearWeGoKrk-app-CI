name: Mobile CI

on:
    push:
        branches: [main]
        paths:
            - "mobile/**"
            - ".github/workflows/mobile.yaml"

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: mobile
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
            - name: Setup node
              uses: actions/setup-node@v4
              with:
                node-version: "20"
                cache: npm
                cache-dependency-path: mobile/package-lock.json
            - name: Installation
              run: |
                npm ci
                npm tsc --noEmit
                npx expo lint 
